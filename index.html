<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Special Story</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MUSIC -->
    <audio id="letterMusic" loop>
        <source src="rakhi-music.mp3" type="audio/mpeg">
    </audio>


    <!-- MOVIE INTRO -->
    <div id="movieIntro">

        <div class="intro-text production">
            A NETRAKUMAR PARGHI
            <span>PRODUCTION</span>
        </div>

        <div class="intro-text presents">
            PRESENTS
        </div>

    </div>


    <!-- MAIN CONTENT -->
    <div id="mainContent">

        <div class="stars"></div>

        <div class="rakhi-wish">

            <p class="festival-line">
                A celebration of the bond
                that makes every memory special.
            </p>

            <h1>
                Happy Raksha Bandhan 🎀
            </h1>

            <h2>
                To My Dear Sister ❤️
            </h2>

            <div class="glow-line"></div>

            <button
                id="continueBtn"
                type="button"
                onclick="startSurprise()">
                Continue 💖
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
